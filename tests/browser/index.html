<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>occt-wasm smoke</title>
  </head>
  <body>
    <script type="module">
      // Runs the kernel in a module Worker, as the Moket geometry worker does.
      window.runSmoke = () =>
        new Promise((resolve, reject) => {
          const worker = new Worker(new URL('./worker.mjs', import.meta.url), { type: 'module' });
          worker.onmessage = (e) => {
            resolve(e.data);
            worker.terminate();
          };
          worker.onerror = (e) => reject(new Error(e.message || 'worker error'));
        });
    </script>
  </body>
</html>
